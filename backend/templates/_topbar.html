{% comment %} Topbar: hamburguesa (móvil) · scope selector · título · chips de vista · iconos {% endcomment %}
<header class="h-16 shrink-0 bg-card border-b border-border flex items-center gap-3 px-4 sm:px-6">
  <!-- hamburguesa móvil -->
  <button @click="sidebarOpen=true" class="md:hidden h-9 w-9 grid place-items-center rounded-lg hover:bg-elevated text-muted">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <!-- scope selector (visual; real con tenancy) -->
  <div class="relative" x-data="{open:false, scope:'MONTERREY1', scopes:['Región Norte (todas)','MONTERREY1','SALTILLO2','All']}">
    <button @click="open=!open" class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-border hover:bg-elevated text-sm">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" class="text-muted"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2"/></svg>
      <span x-text="scope"></span>
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" class="text-muted"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div x-show="open" x-cloak @click.outside="open=false" class="absolute z-30 mt-1 w-60 rounded-xl border border-border bg-card shadow-lg p-1 text-sm">
      <template x-for="s in scopes" :key="s">
        <button @click="scope=s;open=false" class="w-full text-left px-3 py-2 rounded-lg hover:bg-elevated" x-text="s"></button>
      </template>
      <div class="px-3 pt-1 text-[11px] text-muted">Solo Region/Admin ven este selector</div>
    </div>
  </div>

  <div class="hidden lg:block text-sm text-muted">/ {{ page_title }}</div>

  <div class="ml-auto flex items-center gap-1.5">
    <!-- chips de vista -->
    <div class="hidden sm:flex items-center gap-1 mr-2 p-1 rounded-xl bg-elevated">
      {% for v in views %}
        <button @click="setView('{{ v.key }}','{{ v.accent }}')"
                class="px-2.5 py-1 rounded-lg text-[12px] font-medium transition"
                :class="activeView==='{{ v.key }}' ? 'text-white shadow-sm' : 'text-muted hover:text-text'"
                :style="activeView==='{{ v.key }}' ? 'background:{{ v.accent }}' : ''">{{ v.label }}</button>
      {% endfor %}
    </div>
    <!-- iconos -->
    <button class="h-9 w-9 grid place-items-center rounded-lg hover:bg-elevated text-muted">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    </button>
    <button class="h-9 w-9 grid place-items-center rounded-lg hover:bg-elevated text-muted relative">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6M10 20a2 2 0 004 0"/></svg>
      <span class="absolute top-2 right-2 h-1.5 w-1.5 rounded-full" style="background:var(--accent-view)"></span>
    </button>
    <button @click="toggleLang" class="h-9 px-2 grid place-items-center rounded-lg hover:bg-elevated text-muted text-xs font-semibold" x-text="lang"></button>
    <button @click="toggleTheme" class="h-9 w-9 grid place-items-center rounded-lg hover:bg-elevated text-muted">
      <svg x-show="!dark" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M21 12.8A8 8 0 1111 3a6 6 0 0010 9z"/></svg>
      <svg x-show="dark" x-cloak width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
    </button>
    <div class="h-8 w-8 rounded-full grid place-items-center text-white text-xs font-semibold ml-1" style="background:var(--accent-view)">{{ usuario.iniciales }}</div>
  </div>
</header>
