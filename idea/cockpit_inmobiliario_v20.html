<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockpit · Operación inmobiliaria con IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.3.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
:root{
  --ink:#18181B;--ink-soft:#27272A;--ink-line:#3F3F46;--ink-text:#D4D4D8;--ink-dim:#71717A;
  --paper:#F1F5F9;--card:#FFFFFF;--line:#E7EBEE;--line-2:#D6DDE1;
  --text:#15242F;--text-2:#5C6973;--text-3:#94A0A8;
  --teal:#2563EB;--teal-bright:#3B82F6;--teal-tint:#E4EDFD;--teal-ink:#1E40AF;
  --coral:#E2563B;--coral-tint:#FBE3DD;--coral-ink:#A53A24;
  --amber:#BA7517;--amber-tint:#FAEEDA;--amber-ink:#633806;
  --green:#3B6D11;--green-tint:#EAF3DE;--green-ink:#27500A;
  --purple:#534AB7;--purple-tint:#EEEDFE;--purple-ink:#3C3489;--blue-tint:#E6F1FB;--blue-ink:#0C447C;
  --r-sm:7px;--r-md:10px;--r-lg:14px;--fd:'Bricolage Grotesque',serif;--fb:'Hanken Grotesk',sans-serif;
  --sh:0 1px 2px rgba(20,40,55,.04),0 4px 16px rgba(20,40,55,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--paper);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c7d0d6;border-radius:6px}
.ti{font-size:18px;line-height:1;vertical-align:-2px}
.side{background:var(--ink);color:var(--ink-text);display:flex;flex-direction:column;padding:14px 11px;position:sticky;top:0;height:100vh;overflow-y:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{font-size:13px;padding:9px 15px;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab:hover{color:var(--text)}.tab.on{color:#2563EB;border-bottom-color:#2563EB}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 10px}
.brand .mk{width:26px;height:26px;border-radius:7px;background:var(--teal-bright);display:flex;align-items:center;justify-content:center;color:#fff}
.brand b{font-family:var(--fd);font-weight:500;font-size:18px;color:#fff}
.brand span{font-size:10px;color:var(--ink-dim);display:block;margin-top:-2px}
.gl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#586D7E;padding:8px 9px 3px}
.it{display:flex;align-items:center;gap:10px;padding:6px 9px;border-radius:8px;font-size:13px;cursor:pointer;position:relative;color:var(--ink-text);transition:.13s}
.it .ti{font-size:16px;color:#8EA2B2}
.it:hover{background:var(--ink-soft)}
.it.on{background:rgba(59,130,246,.16);color:#60A5FA}.it.on .ti{color:#60A5FA}
.it.on::before{content:"";position:absolute;right:-12px;top:8px;bottom:8px;width:3px;border-radius:3px 0 0 3px;background:#3B82F6}
.it .bd{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:999px;background:var(--amber-tint);color:var(--amber-ink)}
.note{margin-top:auto;font-size:10px;color:var(--ink-dim);padding:10px 9px 2px;border-top:1px solid var(--ink-line);line-height:1.4}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:16px;padding:15px 26px;background:rgba(241,245,249,.88);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{font-family:var(--fd);font-weight:500;font-size:21px}.top .sub{font-size:12.5px;color:var(--text-2);margin-top:1px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;width:220px;color:var(--text-3)}
.search input{border:0;outline:0;font-family:var(--fb);font-size:13px;width:100%;background:transparent;color:var(--text)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);position:relative}
.iconbtn .pip{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--coral)}
.me{width:36px;height:36px;border-radius:50%;background:var(--purple-tint);color:var(--purple-ink);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px}
.view{padding:22px 26px 44px;animation:rise .34s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:999px}
.c-teal{background:var(--teal-tint);color:var(--teal-ink)}.c-coral{background:var(--coral-tint);color:var(--coral-ink)}
.c-amber{background:var(--amber-tint);color:var(--amber-ink)}.c-green{background:var(--green-tint);color:var(--green-ink)}
.c-purple{background:var(--purple-tint);color:var(--purple-ink)}.c-blue{background:var(--blue-tint);color:var(--blue-ink)}.c-gray{background:#EEF1F2;color:#52606a}
.btn{font-family:var(--fb);font-size:13px;font-weight:500;padding:8px 14px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--card);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.14s}
.btn:hover{border-color:#bcc6cc;background:#fafbfb}.btn:active{transform:scale(.98)}
.btn-p{background:var(--teal);border-color:var(--teal);color:#fff}.btn-p:hover{background:#1D4ED8;border-color:#1D4ED8}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh)}
.kpi .lb{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:7px}.kpi .vl{font-family:var(--fd);font-weight:500;font-size:29px;margin-top:6px}.kpi .tr{font-size:11px;color:var(--text-3);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--sh);margin-bottom:16px}
.panel h3{font-family:var(--fd);font-weight:500;font-size:16px;margin-bottom:3px}.panel .ph{font-size:12.5px;color:var(--text-2);margin-bottom:16px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.qrow{display:flex;align-items:center;gap:11px;font-size:13px;padding:10px 0;border-bottom:0.5px solid var(--line)}.qrow:last-child{border:0}
.qrow .ic{width:34px;height:34px;border-radius:50%;background:var(--purple-tint);color:var(--purple-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex:none}
.qrow .tx b{font-weight:500}.qrow .tx p{font-size:11.5px;color:var(--text-2);margin-top:1px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.qrow .rt{margin-left:auto;display:flex;align-items:center;gap:8px}
/* board */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.col{flex:0 0 250px}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 11px}
.col-h .nm{font-weight:500;font-size:13px;display:flex;align-items:center;gap:7px}.col-h .nm i{width:8px;height:8px;border-radius:2px;display:inline-block}
.col-h .ag{font-size:10.5px;color:var(--text-3)}.col-h .ct{margin-left:auto;font-size:11.5px;color:var(--text-3);background:#eaeef0;padding:0 8px;border-radius:999px}
.kcard{background:var(--card);border:0.5px solid var(--line);border-radius:var(--r-md);padding:11px 12px;margin-bottom:10px;cursor:pointer;box-shadow:var(--sh);transition:.14s;animation:rise .4s ease both}
.kcard:hover{border-color:var(--teal-bright);transform:translateY(-1px)}.kcard.warn{border-color:#f0c98a}
.kcard .r1{display:flex;justify-content:space-between;align-items:center;gap:6px}.kcard .nm{font-weight:500;font-size:13px}
.kcard .r2{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.kcard .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:0.5px solid var(--line)}
/* leads table */
.lhead,.lrow{display:grid;grid-template-columns:1.7fr 1fr 1fr .9fr .8fr .8fr;gap:10px;align-items:center}
.lhead{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);padding:0 14px 9px}
.lrow{background:var(--card);border:0.5px solid var(--line);border-radius:var(--r-md);padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:13px;transition:.13s;box-shadow:var(--sh)}.lrow:hover{border-color:var(--teal-bright)}
/* connectors */
.conns{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px}
.conn{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;background:var(--card);box-shadow:var(--sh)}
.conn .ch{display:flex;align-items:center;gap:11px;margin-bottom:12px}.conn .ch b{font-size:15px;font-weight:500}
.conn .lg{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.conn .mrow{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:0.5px solid var(--line)}.conn .mrow:last-of-type{border:0}.conn .mrow span:first-child{color:var(--text-2)}
.synct{display:grid;grid-template-columns:64px 1.5fr .7fr .8fr .6fr;gap:8px;font-size:12.5px;padding:9px 0;border-bottom:0.5px solid var(--line);align-items:center}.synct.h{color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.synct:last-child{border:0}
/* automation */
.ag-admin{border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 17px;background:var(--card);box-shadow:var(--sh);margin-bottom:13px}
.ag-admin .top2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ag-admin .top2 b{font-size:15px;font-weight:500}.ag-admin .auto{margin-left:auto;font-size:12px;color:var(--text-2)}.ag-admin .auto b{color:var(--text)}
.gridA{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin:13px 0 2px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin-bottom:9px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:var(--r-md);overflow:hidden;width:fit-content;max-width:100%}
.seg span{font-size:11.5px;padding:7px 12px;color:var(--text-2);border-right:1px solid var(--line);white-space:nowrap;cursor:pointer}.seg span:last-child{border-right:0}.seg span:hover{background:#f6f8f8}.seg span.on{background:var(--teal);color:#fff}
.metric{display:flex;align-items:baseline;gap:7px}.metric .n{font-family:var(--fd);font-size:25px;font-weight:500}.metric .u{font-size:12px;color:var(--text-2)}
.rec{display:flex;align-items:flex-start;gap:8px;font-size:12px;border-radius:var(--r-md);padding:9px 12px;margin-top:11px}.rec.good{background:var(--teal-tint);color:var(--teal-ink)}.rec.warn{background:var(--amber-tint);color:var(--amber-ink)}
.skills{display:flex;gap:6px;flex-wrap:wrap}.sk{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-2);display:inline-flex;align-items:center;gap:5px}.sk i{color:var(--teal);font-size:13px}
.hint{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-2);background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;margin-bottom:16px}
/* inbox */
.convo-wrap{display:flex;gap:16px;height:calc(100vh - 148px);min-height:600px}
.inbox{display:grid;grid-template-columns:240px 1fr;flex:1 1 auto;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh);height:100%}
.convos{border-right:1px solid var(--line);overflow-y:auto}
.cv{display:flex;gap:11px;padding:13px 15px;cursor:pointer;border-bottom:1px solid var(--line)}.cv:hover{background:#f7f9fa}.cv.on{background:var(--teal-tint)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;background:#e9eef0;color:#516069}
.cv .tx{min-width:0;flex:1}.cv .tx b{font-size:13.5px;font-weight:500;display:block}.cv .tx p{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cv .si{text-align:right;font-size:10.5px;color:var(--text-3)}.cv .si .un{display:inline-block;margin-top:5px;background:var(--teal);color:#fff;border-radius:999px;min-width:17px;height:17px;line-height:17px;font-size:10.5px;padding:0 4px}
.thread{display:flex;flex-direction:column;min-width:0}.th-h{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:#fbfcfc}
.bub{max-width:74%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.45}.bub.in{align-self:flex-start;background:#eef1f2;border-bottom-left-radius:4px}.bub.out{align-self:flex-end;background:var(--teal-tint);color:var(--teal-ink);border-bottom-right-radius:4px}.bub .tm{display:block;font-size:10px;color:var(--text-3);margin-top:4px;text-align:right}
.suggest{border-top:1px solid var(--line);padding:14px 18px;background:var(--card)}.suggest .slbl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--teal-ink);font-weight:500;margin-bottom:9px}
.draft{background:var(--teal-tint);border:1px dashed #b7cdf6;border-radius:var(--r-md);padding:11px 13px;font-size:13.5px;color:var(--teal-ink);line-height:1.5}
.confbar{height:6px;background:#e7ebee;border-radius:6px;overflow:hidden;margin:11px 0 4px}.confbar i{display:block;height:100%;background:var(--teal-bright);border-radius:6px}
.toggle{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.sw{width:38px;height:21px;border-radius:999px;background:#cfd7db;position:relative;cursor:pointer;transition:.18s;flex:none}.sw i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.18s}.sw.on{background:var(--teal)}.sw.on i{left:19px}
.cv .src{margin-top:5px}
.srcb{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:#fff;padding:3px 9px;border-radius:999px}.srcb .ti{font-size:13px}
.av-wrap{position:relative;flex:none}
.av-badge{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;color:#fff}.av-badge .ti{font-size:10px}
.online{width:8px;height:8px;border-radius:50%;background:#1FA855;box-shadow:0 0 0 3px rgba(31,168,85,.18);flex:none}
.typing{display:inline-flex;gap:4px;align-items:center}.typing i{width:6px;height:6px;border-radius:50%;background:#9aa7ad;display:inline-block;animation:bl 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.profile{flex:0 0 330px;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow-y:auto;padding:13px 15px 20px;background:var(--card);height:100%}
.pf-h{display:flex;align-items:center;gap:10px;padding-bottom:11px;border-bottom:0.5px solid var(--line)}
.pf-sec{padding:11px 0;border-bottom:0.5px solid var(--line)}.pf-sec:last-child{border:0;padding-bottom:0}
.pf-sec h5{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px}.pf-sec h5 .ti{font-size:14px;color:var(--teal)}
.pf-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:2.5px 0}.pf-row .ti{font-size:14px;color:var(--text-3);flex:none}.pf-row .v{margin-left:auto;color:var(--text-2);font-size:11.5px;text-align:right}
.pf-tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:10.5px;padding:2px 8px;border-radius:999px;border:0.5px solid var(--line-2);color:var(--text-2)}
.scorebox{background:var(--teal-tint);border:0.5px solid #c9dbfb;border-radius:var(--r-md);padding:11px 12px}
.scorebox .sc-top{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.sug-pill{font-size:11px;color:var(--teal-ink);background:var(--card);border:0.5px solid #c9dbfb;border-radius:var(--r-sm);padding:8px 10px;display:flex;gap:7px;align-items:flex-start;line-height:1.4;margin-top:9px}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fp{font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.fp.ai{background:var(--teal-tint);color:var(--teal-ink);border-color:#c9dbfb}
.fp.hum{background:#EEF2F6;color:#475569}
.flow .ar{color:var(--text-3);font-size:15px}
.loop{font-size:10.5px;color:var(--coral-ink);background:var(--coral-tint);padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.bigbar{position:relative;height:14px;background:#e7ebee;border-radius:8px;overflow:hidden}.bigbar i{display:block;height:100%;background:linear-gradient(90deg,#3B82F6,#2563EB);border-radius:8px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh);margin-bottom:13px}
.acard .ac-h{display:flex;align-items:center;gap:11px;margin-bottom:13px}.acard .ac-h .rt{margin-left:auto}
.acard .ac-m{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.acard .ac-m .m{background:var(--paper);border-radius:var(--r-md);padding:9px 11px}.acard .ac-m .m .l{font-size:11px;color:var(--text-2)}.acard .ac-m .m .v{font-family:var(--fd);font-size:18px;font-weight:500;margin-top:2px}
.skill{display:flex;align-items:center;gap:9px;font-size:12px;margin-bottom:6px}.skill .sl{width:104px;color:var(--text-2);flex:none}.skill .st{flex:1;height:7px;background:#eef1f2;border-radius:6px;overflow:hidden}.skill .st i{display:block;height:100%;background:#3B82F6;border-radius:6px}.skill .sv{width:30px;text-align:right;flex:none;font-weight:500}
.ac-foco{display:flex;align-items:center;gap:8px;font-size:12.5px}
.mm-head,.mm-row{display:grid;grid-template-columns:1.5fr .9fr repeat(6,.55fr) 1.7fr;gap:8px;align-items:center;font-size:12.5px}
.mm-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);padding:0 12px 9px}
.mm-row{background:var(--card);border:0.5px solid var(--line);border-radius:var(--r-md);padding:11px 12px;margin-bottom:7px;box-shadow:var(--sh)}
.led-head,.led-row{display:grid;grid-template-columns:.5fr 1.3fr 1fr .9fr .9fr .9fr .9fr .7fr;gap:8px;align-items:center;font-size:12.5px}
.led-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);padding:0 12px 9px}
.led-row{background:var(--card);border:0.5px solid var(--line);border-radius:var(--r-md);padding:11px 12px;margin-bottom:7px;box-shadow:var(--sh)}
/* dashboard comisiones */
.flts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.flt{min-width:118px}
.fl-l{font-size:10.5px;color:var(--text-3);margin-bottom:3px}

     '<div class="section"><h4>Propiedades sugeridas</h4>'+props.map(p=>'<div class="mp"><span class="tn" style="background:'+p.c+'"><i class="ti ti-home" style="font-size:17px"></i></span><div><div style="font-weight:500">'+p.pr+'</div><div style="font-size:11.5px;color:var(--text-2)">'+p.z+'</div></div><span class="mm">'+p.match+'%</span></div>').join('')+'</div>'+
     '<div class="section"><h4>Actividad y trazabilidad</h4><div class="tl"><div class="ev"><div class="et">Entró por '+(FUENTES[l.fuente]?FUENTES[l.fuente].n:l.fuente)+' · #'+l.ext+'</div><div class="ed">sincronización · hoy 10:31</div></div><div class="ev"><div class="et">Asignado a '+l.asesor+'</div><div class="ed">automático · 10:31</div></div><div class="ev"><div class="et">Calificado por Intake — '+(l.g==='?'?'en proceso':l.g+' · '+l.s)+'</div><div class="ed">automático</div></div><div class="ev"><div class="et">'+ag.nombre.split(' ')[0]+' está trabajando este lead</div><div class="ed">'+(l.aprobar?'esperando aprobación':'en curso')+'</div></div></div></div>'+
     '<div class="section"><h4>Si no avanza — motivo</h4><div style="font-size:12px;color:var(--text-2);margin-bottom:4px">Se alimenta al matching para la próxima vuelta.</div><div class="reject"><select><option>Precio fuera de rango</option><option>Zona no convenció</option><option>No es el momento</option><option>Encontró con otra inmobiliaria</option><option>Dejó de responder</option></select><button class="btn" onclick="toast(\'Enviado a Reactivación\');closeDrawer()"><i class="ti ti-archive"></i>A reactivación</button></div></div>'+
   '</div>';
  $('#drawer').classList.add('on');$('#scrim').classList.add('on');
}
function closeDrawer(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');}
let tt;function toast(m){$('#tmsg').textContent=m;$('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('on'),2400);}

renderNav();go('pipeline');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
</script>
</body>
</html>
